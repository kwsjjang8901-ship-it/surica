# suricata-update: 끌 룰 (sid, group:<파일명>, re:<정규식>)
#
# ET Open 카테고리 기본값. nsm 저장소 docs/SURICATA_INTEGRATION_DESIGN.md 6.1절(Zeek 행위 탐지와 겹치지 않게).
# 공개 데이터(CIC-IDS2017) 측정(같은 문서 7장 S5) 뒤 확정한다. 켜려면 이 줄을 지우거나 enable.conf 에 sid 를 적는다.
# 미러(패시브) 환경에서 의미 없는 룰, 사내에서 과탐이 확인된 룰도 여기에 둔다.

# IP 평판 목록: IOC 는 Zeek IOC_Match(탐지 35)로 한 곳에서 관리한다
group:ciarmy.rules
group:compromised.rules
group:drop.rules
group:dshield.rules
group:tor.rules
group:botcc.rules
group:botcc.portgrouped.rules

# DNS: Zeek DNS_Tunneling·DGA_Domain 과 겹침. 악성 도메인 조회 룰은 malware·current_events 에 있다
group:emerging-dns.rules

# 정책·정보성: 경보가 대부분 정보성. AI 서비스(33)·비표준 포트(24)·자체 서명 인증서(09)와 겹치는 룰 포함
group:emerging-policy.rules
group:emerging-info.rules
group:emerging-hunting.rules
group:emerging-inappropriate.rules
group:emerging-games.rules
group:emerging-chat.rules
group:emerging-p2p.rules
group:emerging-user_agents.rules
group:emerging-icmp.rules
group:emerging-icmp_info.rules

# TLS 지문: 범위에서 뺌(2026-11 결정)
group:emerging-ja3.rules

# 광고·PUP(MDS 가 봄), DoS(미러 구간에서 의미가 작음): 고객 요청 시 켬
group:emerging-adware_pup.rules
group:emerging-dos.rules

# 산업 제어: 고객망에 OT 장비가 있을 때만 켬
group:emerging-scada.rules

# 스캔: 횟수로 판단하는 룰만 끔(Zeek Port_Scan·Host_Scan·SSH/FTP_Bruteforce 와 겹침). 도구 지문 룰은 켠 채로 둔다
re:msg:"ET SCAN[^"]*";.*(threshold|detection_filter):

# Zeek TLS_Heartbleed(27)와 겹침
re:heartbleed

# Suricata 기본 이벤트 룰(디코더·스트림·앱 계층 이상, msg "SURICATA ...", 약 370개): suricata-update 가 기본으로 넣는다.
# 미러 구간은 패킷 누락·비대칭이 흔해 STREAM·체크섬 경보가 계속 나고, 같은 이상은 Zeek weird.log 가 본다.
# 공격 단계가 없는 경보(Suricata_Other)라 스토리에도 들어가지 않는다. 조사할 때만 켠다.
re:msg:"SURICATA\s
